startCommand:
  type: stdio
  configSchema:
    type: object
    required: [linkfetchApiKey]
    properties:
      linkfetchApiKey:
        type: string
        description: LinkFetch API key (lf_…) from https://linkfetch.io/app/mcp
  commandFunction: |-
    (config) => ({ command: "node", args: ["dist/index.js"], env: { LINKFETCH_API_KEY: config.linkfetchApiKey } })
